[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "whatsapp_group"
version = "0.0.1"
description = "A sneak-peek at some of the analytics regarding a whatsapp group created for work purposes, showing some of the most frequent words and phrases used throughout its lifespan."
authors = [
  { name = "Carlos Sotomayor" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["whatsapp_group"]
include = ["pyproject.toml", "whatsapp_group/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["whatsapp_group"]
force-sort-within-sections = true

